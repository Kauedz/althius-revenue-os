# Althius Revenue OS: tudo em Docker, em servidor nosso (ADR 0041). Leia docker/LEIA-ME.md.
# Só o contêiner "web" publica porta. O banco e os demais serviços ficam na rede interna.
name: althius

services:
  db:
    image: supabase/postgres:17.11.0.002
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode "npm run docker:env" antes}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SITE_URL}
      # Os links dos e-mails/convites passam pelo Caddy em /auth/v1.
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Link de definir senha vale uma vez e dura 24 h (quem roda o criar-superadmin entrega por canal seguro).
      GOTRUE_MAILER_OTP_EXP: "86400"
      # Sem cadastro aberto: as pessoas entram por convite/superadmin (service_role continua podendo criar).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTOCONFIRMAR_EMAIL:-true}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]

  storage:
    image: supabase/storage-api:v1.79.28
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      TENANT_ID: althius
      REGION: local
      GLOBAL_S3_BUCKET: althius
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: "52428800"
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ENABLED: "false"
      VECTOR_ENABLED: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [interna]

  # Aplica as migrations e (só em desenvolvimento) os dados de demonstração. Roda e sai.
  migrar:
    image: supabase/postgres:17.11.0.002
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEMEAR_DEMO: ${SEMEAR_DEMO:-false}
    entrypoint: ["/bin/sh", "/migrar.sh"]
    volumes:
      - ./docker/migrar.sh:/migrar.sh:ro
      - ./supabase/migrations:/migracoes:ro
      - ./supabase/seed.sql:/seed.sql:ro
    networks: [interna]

  rest:
    image: postgrest/postgrest:v16.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks: [interna]

  # Fila dos workers (BullMQ). Os workers e o MCP entram aqui quando tiverem ponto de entrada (ADR 0041).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?rode \"npm run docker:env\" antes}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [interna]

  # Receptor de webhooks da Unipile (mensagens, e-mails, status de conexão). Só o Caddy fala com ele (/webhooks/unipile).
  webhooks:
    build:
      context: .
      dockerfile: docker/Dockerfile.webhooks
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      BANCO_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Segredo que a própria Unipile gera ao cadastrar o webhook (v2). Vazio = recusa todo webhook (401).
      UNIPILE_WEBHOOK_SECRET: ${UNIPILE_WEBHOOK_SECRET:-}
      # Conexão de contas de mensagem (PR 05). Sem a chave, a tela avisa que a conexão está indisponível.
      SITE_URL: ${SITE_URL}
      ANON_KEY: ${ANON_KEY}
      UNIPILE_API_KEY: ${UNIPILE_API_KEY:-}
      UNIPILE_API_URL: ${UNIPILE_API_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/saude"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  # Motor de cadência (PR 06): a cada minuto pega os passos que venceram e cria tarefas ou envia e-mail/WhatsApp.
  # Quem decide é o banco (política Hermes, créditos, agente pausado); aqui só se repete o ciclo e se fala com o provedor.
  cadencia:
    build:
      context: .
      dockerfile: docker/Dockerfile.cadencia
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      BANCO_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Sem a chave, só passos que viram tarefa rodam; o envio automático fica parado (nunca finge enviar).
      UNIPILE_API_KEY: ${UNIPILE_API_KEY:-}
      UNIPILE_API_URL: ${UNIPILE_API_URL:-}
      CADENCIA_INTERVALO_SEGUNDOS: ${CADENCIA_INTERVALO_SEGUNDOS:-60}
    networks: [interna]

  # Harness dos agentes (PR 14): entrega os pedidos dos canais ao Hermes Agent de cada cliente e grava a resposta.
  # Só roda para quem tem executor em ./docker/agentes-executores.json (copie de agentes-executores.exemplo.json).
  # Sem arquivo ou sem entrada para o agente, o pedido espera na fila: nunca existe resposta de mentira.
  agentes:
    build:
      context: .
      dockerfile: docker/Dockerfile.agentes
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    environment:
      BANCO_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      AGENTES_EXECUTORES_ARQUIVO: /config/agentes-executores.json
      AGENTES_INTERVALO_SEGUNDOS: ${AGENTES_INTERVALO_SEGUNDOS:-3}
    volumes:
      - ./docker/agentes-executores.json:/config/agentes-executores.json:ro
    networks: [interna]

  # Backup agendado do banco e dos arquivos, em ./backups (copie para fora do servidor).
  backup:
    image: supabase/postgres:17.11.0.002
    restart: unless-stopped
    depends_on:
      migrar:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVALO_HORAS: ${BACKUP_INTERVALO_HORAS:-24}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage-data:/var/lib/storage:ro
    networks: [interna]

  # Único contêiner com porta aberta: front + proxy HTTPS.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${SITE_URL}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_ALTHIUS_MODO: real
    restart: unless-stopped
    depends_on:
      migrar:
        condition: service_completed_successfully
      rest:
        condition: service_started
      webhooks:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_URL}}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
    networks: [interna]

networks:
  interna:

volumes:
  db-data:
  storage-data:
  redis-data:
  caddy-data:
